services:
  - type: web
    name: gcc-connect-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
