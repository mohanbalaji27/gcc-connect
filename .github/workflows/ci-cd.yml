name: 🚀 GCC Connect CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Security & Code Quality Checks
  # ────────────────────────────────────────────────────────────
  security-scan:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root deps
        run: npm ci --ignore-scripts

      - name: Audit shared package
        run: npm audit --audit-level=moderate
        working-directory: packages/shared
        continue-on-error: true

      - name: Audit backend package
        run: npm audit --audit-level=moderate
        working-directory: packages/backend
        continue-on-error: true

      - name: Audit web package
        run: npm audit --audit-level=moderate
        working-directory: packages/web
        continue-on-error: true

      - name: Check for secret leaks (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  # Job 2: Build & Test Backend
  # ────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared deps
        working-directory: packages/shared
        run: npm ci

      - name: Build shared
        working-directory: packages/shared
        run: npm run build

      - name: Install backend deps
        working-directory: packages/backend
        run: npm ci

      - name: TypeScript check
        working-directory: packages/backend
        run: npx tsc --noEmit

      - name: Run backend tests
        working-directory: packages/backend
        run: npm test
        env:
          NODE_ENV: test
          # JWT secret for tests only — not a real secret
          JWT_SECRET: test_only_jwt_secret_not_used_in_prod

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: packages/backend/coverage/

  # ────────────────────────────────────────────────────────────
  # Job 3: Build Web App
  # ────────────────────────────────────────────────────────────
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared deps
        working-directory: packages/shared
        run: npm ci

      - name: Build shared
        working-directory: packages/shared
        run: npm run build

      - name: Install web deps
        working-directory: packages/web
        run: npm ci

      - name: TypeScript check
        working-directory: packages/web
        run: npx tsc --noEmit

      - name: Build web app
        working-directory: packages/web
        run: npm run build
        env:
          # Use placeholder — real URL set via GitHub Secrets
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.gccconnect.example.com/api' }}
          VITE_DEMO_MODE: 'false'

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 4: Deploy to GitHub Pages (Web App preview)
  # Runs only on main branch push
  # ────────────────────────────────────────────────────────────
  deploy-pages:
    name: 📄 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-backend, build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build shared
        working-directory: packages/shared
        run: npm ci && npm run build

      - name: Install and build web
        working-directory: packages/web
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api' }}
          VITE_DEMO_MODE: 'true'
          # GitHub Pages serves from /gcc-connect/ subdirectory
          VITE_BASE_PATH: '/gcc-connect/'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────────────────────────
  # Job 5: Notify on completion
  # ────────────────────────────────────────────────────────────
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [test-backend, build-web]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## GCC Connect Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
